<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bootstrapp Works</title>
<meta name="description" content="暮らしの中で使う小さなアプリをつくっています。">
<meta name="theme-color" content="#FF7424">
<link rel="icon" type="image/webp" href="assets/icon.webp">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bootstrappworks.com/">
<meta property="og:title" content="Bootstrapp Works">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFF6EE;color:#3A1A12;font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;line-height:1.3;margin:0;text-wrap:balance;word-break:auto-phrase}
p{margin:0}
a{color:#C7245E}a:hover{color:#8E1640}
.doc{max-width:720px;margin:0 auto;padding-left:24px;padding-right:24px}
.hero{background:radial-gradient(circle at 100% 0%,#FF4D8A 0,rgba(255,77,138,.85) 18%,rgba(255,77,138,0) 52%),radial-gradient(circle at 0% 100%,rgba(255,200,60,.5) 0,rgba(255,200,60,0) 40%),#FF7424}
.hero .doc{padding-top:clamp(64px,11vw,112px);padding-bottom:clamp(32px,5vw,56px)}
.hero h1{font-size:clamp(40px,8vw,68px);font-weight:900;letter-spacing:-.01em;color:#fff;text-shadow:4px 5px 0 #3A1A12}
.lead{margin-top:24px;font-size:18px;font-weight:700;color:#2A0E08;text-wrap:balance;word-break:auto-phrase}
.wave{display:block;width:100%;height:clamp(36px,6vw,72px)}
main{padding:32px 0 88px}
section+section{margin-top:56px}
h2{font-size:clamp(24px,4.6vw,30px);font-weight:900;margin-bottom:18px}
.app{display:flex;align-items:center;gap:18px;padding:20px;background:#fff;border-radius:32px;box-shadow:0 14px 32px rgba(220,70,60,.14);color:#3A1A12;text-decoration:none}
.app:hover{color:#3A1A12;box-shadow:0 18px 40px rgba(220,70,60,.24)}
.app img{flex:none;width:88px;height:88px;border-radius:22px;display:block}
.app h3{font-size:24px;font-weight:900}
.app h3 span{font-size:15px;font-weight:700}
.app p{margin-top:4px;font-size:15.5px;line-height:1.7;color:#4E2E24}
.mail{font-weight:700;overflow-wrap:anywhere}
footer{background:#3A1A12;color:#F3D9CC;font-size:13px}
footer .doc{padding-top:28px;padding-bottom:28px}
</style>
</head>
<body>
<header class="hero">
<div class="doc">
<h1>Bootstrapp Works</h1>
<p class="lead">暮らしの中で使う小さなアプリをつくっています。</p>
</div>
<svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 44 C 120 4 240 4 360 44 S 600 84 720 44 960 4 1080 44 1320 84 1440 44 V80 H0 Z" fill="#FFF6EE"></path></svg>
</header>

<main class="doc">
<section>
<h2>アプリ</h2>
<a class="app" href="https://pakiin.bootstrappworks.com/">
<img src="assets/icon.webp" alt="" width="88" height="88">
<div>
<h3>PAKÍIN! <span>（パキーン）</span></h3>
<p>タスクをパキーンと割って終わらせる、iPhone向けToDoアプリ</p>
</div>
</a>
</section>

<section>
<h2>お問い合わせ</h2>
<p><a class="mail" href="mailto:bootstrappworks-support@googlegroups.com">bootstrappworks-support@googlegroups.com</a></p>
</section>
</main>

<footer>
<div class="doc">
<p>© 2026 Bootstrapp Works. All rights reserved.</p>
</div>
</footer>
</body>
</html>
